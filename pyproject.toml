[project]
name = "aico"
version = "0.1.0"
description = "AICO — Retrieval Engineering (Day 1: Lexical Baseline · Day 2: Embeddings & Hybrid · Day 3: Model Gateway · Day 4: Structured Contracts)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-core>=1.41.0",
    "azure-identity>=1.25.3",
    "fastapi>=0.141.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.5",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Upstream-only noise: Starlette 1.6.0's own testclient.py module-level
    # code still references the deprecated anyio.abc.BlockingPortal alias
    # internally (anyio's own deprecation, not ours) - nothing in this
    # codebase touches anyio.abc.BlockingPortal, and there is no
    # currently-released Starlette version that avoids it. Scoped to the
    # exact message/module so a real BlockingPortal usage introduced later
    # in this codebase's own code would still surface normally.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
# Explicit, not ruff's own version-dependent implicit default (working
# rule: thresholds/config should be explicit and reviewed, not whatever a
# tool happens to default to today) - Day 7 Task 13 is the first time this
# repository runs a linter at all, over six days of prior, already-
# accepted code, so the rule selection below is deliberately the common,
# widely-adopted "real bug or genuine readability" set (pyflakes,
# pycodestyle, import sorting, bugbear, pyupgrade) rather than every rule
# set ruff ships - see docs/adr/ADR-005-ruff-adoption.md for the full
# rationale, what was fixed vs. suppressed and why, one rule at a time.
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line-too-long - this codebase's docstrings/comments are
             # deliberately long-form narrative prose across all six prior
             # days (a consistent, already-reviewed style choice, not
             # something Task 13 should force a mechanical rewrap of), and
             # no formatter (black/ruff format) is configured to wrap them.
    "B008",  # function-call-in-default-argument - FastAPI's own Depends(...)
             # pattern (Day 6, src/aico/api/*.py) is exactly this shape by
             # design; the framework, not this codebase, calls the
             # function once per request, not once at import time.
    "UP042", # replace-str-enum - every enum in this codebase is
             # deliberately `class X(str, Enum)`, not `StrEnum`, because it
             # predates this rule and changing the base class touches
             # Pydantic v2 (de)serialization and isinstance/equality
             # behavior already exercised by six days of accepted tests -
             # a modernization, not a bug, and not one to retrofit onto
             # previously-accepted code as a side effect of adding a linter.
    "UP047", # non-pep695-generic-function - same reasoning as UP042: a
             # Python 3.12+ generic-syntax modernization for existing
             # TypeVar-based generics, not a defect.
]

[tool.ruff.lint.per-file-ignores]
# Test files intentionally build literal nested config objects (Day 3's
# GatewayConfig fixtures) inline for readability at the call site, and
# f-strings with no placeholder are used a few places purely for
# consistent quoting with an adjacent f-string in the same literal.
"tests/*" = ["F541"]
