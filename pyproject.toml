[project]
name = "aico"
version = "0.1.0"
description = "AICO — Retrieval Engineering (Day 1: Lexical Baseline · Day 2: Embeddings & Hybrid · Day 3: Model Gateway · Day 4: Structured Contracts)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-core>=1.41.0",
    "azure-identity>=1.25.3",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
